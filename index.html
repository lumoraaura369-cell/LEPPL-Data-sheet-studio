<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lummora_DataSheet_Studio</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#eef1f5;--card:#fff;--ink:#14213d;--mut:#5b6678;--line:#cfd6e0;--acc:#0f766e;--ok:#15803d;--bad:#b91c1c;--calc:#e6f4f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1624;--card:#17202f;--ink:#e6ebf3;--mut:#93a0b5;--line:#2b3850;--acc:#4fd1c5;--ok:#4ade80;--bad:#f87171;--calc:#12332f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1624;--card:#17202f;--ink:#e6ebf3;--mut:#93a0b5;--line:#2b3850;--acc:#4fd1c5;--ok:#4ade80;--bad:#f87171;--calc:#12332f}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,Arial,sans-serif}
header{padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--card);display:flex;gap:8px 16px;flex-wrap:wrap;justify-content:space-between;align-items:center}
h1{font-size:17px;margin:0}.m{color:var(--mut);font-size:12px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0}
button,.b{padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;cursor:pointer;font:inherit;white-space:nowrap}
nav button[aria-selected="true"],button.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wrap{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px;padding:14px 16px;align-items:start}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px}
.panel h3{font-size:13px;margin:12px 0 6px;color:var(--acc)}
label{display:block;font-size:11px;color:var(--mut);margin-bottom:6px}
input{width:100%;margin-top:2px;padding:6px 7px;border:1px solid var(--line);border-radius:3px;background:var(--card);color:var(--ink);font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#doc{background:#fff;color:#000;border:1px solid var(--line);padding:14px;overflow-x:auto}
#doc table{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:12.5px}
#doc td,#doc th{border:1px solid #444;padding:4px 6px;vertical-align:middle}
#doc th{background:#1f3864;color:#fff;text-align:left}
#doc .hd td{text-align:center;font-weight:700;height:26px}
#doc .lg{height:70px}#doc .lg img{max-height:62px;max-width:100%}
#doc .c{background:#e6f4f2;font-weight:700}
#doc .ok{color:#15803d;font-weight:700}#doc .no{color:#b91c1c;font-weight:700}
#doc h2{font-size:15px;text-align:center;margin:10px 0}
@media print{header,nav,.panel{display:none}.wrap{display:block;padding:0}body{background:#fff}#doc{border:0;padding:0}}
</style></head><body>
<header><h1>Lummora_DataSheet_Studio</h1><span class="m" id="st"></span></header>
<nav id="tabs" role="tablist"></nav>
<div class="wrap"><div class="panel" id="frm"></div><div id="doc"></div></div>
<script>
var G=9.80665,WD="(999.83952+16.945176*T-7.9870401e-3*T^2-46.170461e-6*T^3+105.56302e-9*T^4-280.54253e-12*T^5)/(1+16.87985e-3*T)";
// sections: [name,[[key,label,unit,default]]]  string default = text field
var TY=[];
function csv(){var t=TY[cur],r=run(),L=[["Section","Item","Value","Unit"]];t.sec.forEach(function(s){s[1].forEach(function(f){L.push([s[0],f[1],r.v[f[0]],f[2]])})});r.res.forEach(function(x){L.push(["Calculated",x[0],x[1],x[2]])});r.ck.forEach(function(x){L.push(["Check",x[0],x[1]===null?"n/a":x[1]?"OK":"FAIL",""])});var s=L.map(function(a){return a.map(function(c){return '"'+String(c==null?"":c).replace(/"/g,'""')+'"'}).join(",")}).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv"}));a.download=t.id+"_datasheet.csv";a.click()}
var ST={},cur=0,SC={},fam="Rotating Equipment",cs=null;
try{ST=JSON.parse(localStorage.getItem("lum_dss_v1")||"{}")}catch(e){}
function sv(){try{localStorage.setItem("lum_dss_v1",JSON.stringify(ST))}catch(e){}}
function ev(s,env){var tk=s.match(/\d*\.?\d+(?:e[+-]?\d+)?|[A-Za-z_]\w*|[()+\-*\/^,]/g),i=0,F={sqrt:Math.sqrt,ln:Math.log,log10:Math.log10,abs:Math.abs,min:Math.min,max:Math.max,step:function(x){return x>0?1:0}};
function pk(){return tk[i]}function nx(){return tk[i++]}
function ex(){var a=tm();while(pk()=="+"||pk()=="-"){var o=nx(),b=tm();a=o=="+"?a+b:a-b}return a}
function tm(){var a=pw();while(pk()=="*"||pk()=="/"){var o=nx(),b=pw();a=o=="*"?a*b:a/b}return a}
function pw(){var a=un();if(pk()=="^"){nx();return Math.pow(a,pw())}return a}
function un(){if(pk()=="-"){nx();return -un()}return at()}
function at(){var t=nx();if(t==null)throw 0;if(t=="("){var v=ex();nx();return v}if(/^[\d.]/.test(t))return parseFloat(t);if(t=="pi")return Math.PI;
if(pk()=="("){nx();var a=[];if(pk()!=")"){a.push(ex());while(pk()==","){nx();a.push(ex())}}nx();if(!F[t])throw 0;return F[t].apply(null,a)}
if(!(t in env))throw 0;return env[t]}
var r=ex();if(i<tk.length)throw 0;return r}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fm(v,d){return v.toLocaleString("en-IN",{maximumFractionDigits:d,minimumFractionDigits:0})}
function vals(){var t=TY[cur],s=ST[t.id]||{},o={};t.sec.forEach(function(x){x[1].forEach(function(f){o[f[0]]=s[f[0]]!=null?s[f[0]]:f[3]})});return o}
function run(){var t=TY[cur],v=vals(),env={},res=[],ck=[];
Object.keys(v).forEach(function(k){var n=parseFloat(v[k]);if(typeof v[k]!="string"||(v[k]!==""&&!isNaN(n)&&isFinite(v[k]))){if(!isNaN(n))env[k]=n}});
t.calc.forEach(function(c){var x=NaN;try{x=ev(c[3],env)}catch(e){}if(isFinite(x)){env[c[0]]=x;res.push([c[1],fm(x,c[4]),c[2]])}else res.push([c[1],"—",c[2]])});
t.chk.forEach(function(c){var x=NaN;try{x=ev(c[1],env)}catch(e){}ck.push([c[0],isFinite(x)?x>=-1e-9:null,c[2]])});
return{v:v,res:res,ck:ck}}
var MF=[["cl","Client","NTPC Limited"],["epc","EPC Contractor","Oswal Energies Limited"],["dc","Design Contractor","PLECO"],["pj","Project","BALANCE OF PLANT (BOP) PACKAGE FOR CCU (CARBON CAPTURE AND UTILIZATION) PLANTS"],["dn","Document No.","0110-111-001-XXX-XXXX"],["rv","Revision","0"],["dt","Date",""],["sb","Submission","Issued for Client Review"],["pb","Prepared by","" ],["ck","Checked by",""],["ap","Approved by (Oswal)",""]];
function meta(k,d){var m=ST.meta||{};return m[k]!=null?m[k]:d}
function form(){var t=TY[cur],v=vals(),h="<h3>Document header</h3>";
MF.forEach(function(f){h+="<label>"+f[1]+"<input data-m='"+f[0]+"' value='"+esc(meta(f[0],f[2]))+"'></label>"});
h+="<label>Logos: Client, EPC, Design Contractor<input type='file' id='lg' accept='image/*' multiple></label>";
t.sec.forEach(function(s){h+="<h3>"+s[0]+"</h3>";s[1].forEach(function(f){h+="<label>"+f[1]+(f[2]?" ("+f[2]+")":"")+"<input data-k='"+f[0]+"' value='"+esc(v[f[0]])+"'></label>"})});
h+="<div class='row'><button class='p' id='pr'>Print / Save PDF</button><button id='rs'>Reset values</button><button id='ex'>Export CSV</button></div><h3>Server</h3><div class='row'><button id='s1'>Save draft</button><button id='s2'>Send for review</button><button id='s3' class='p'>Approve</button></div><div class='m' id='sm'></div><h3>Saved datasheets</h3><div id='sl' class='m'></div><div class='row' style='display:none'></div>";
var e=document.getElementById("frm");e.innerHTML=h;
e.querySelectorAll("[data-m]").forEach(function(i){i.oninput=function(){ST.meta=ST.meta||{};ST.meta[i.dataset.m]=i.value;sv();doc()}});
e.querySelectorAll("[data-k]").forEach(function(i){i.oninput=function(){ST[t.id]=ST[t.id]||{};ST[t.id][i.dataset.k]=i.value;sv();doc()}});
document.getElementById("pr").onclick=function(){window.print()};
document.getElementById("rs").onclick=function(){delete ST[t.id];sv();form();doc()};document.getElementById("ex").onclick=csv;
document.getElementById("s1").onclick=function(){saveS("Draft")};document.getElementById("s2").onclick=function(){saveS("Review")};document.getElementById("s3").onclick=function(){saveS("Approved")};listS();
document.getElementById("lg").onchange=function(){var fs=Array.prototype.slice.call(this.files,0,3);fs.forEach(function(f,i){var r=new FileReader();r.onload=function(){ST.logo=ST.logo||[];ST.logo[i]=r.result;sv();doc()};r.readAsDataURL(f)})}}
function doc(){var t=TY[cur],r=run(),L=ST.logo||[],h="";
function lg(i){return L[i]?"<img src='"+L[i]+"' alt=''>":"<span style='color:#999'>logo</span>"}
h+="<table><tr class='hd'><td style='width:34%'>CLIENT</td><td style='width:33%'>EPC CONTRACTOR</td><td>DESIGN CONTRACTOR</td></tr><tr class='hd lg'><td>"+lg(0)+"<br><small>"+esc(meta("cl","NTPC Limited"))+"</small></td><td>"+lg(1)+"<br><small>"+esc(meta("epc","Oswal Energies Limited"))+"</small></td><td>"+lg(2)+"<br><small>"+esc(meta("dc","PLECO"))+"</small></td></tr></table>";
h+="<table><tr><td><b>PROJECT:</b> "+esc(meta("pj",MF[3][2]))+"</td></tr></table><h2>"+t.title+"</h2><table><tr><td><b>DOCUMENT NUMBER</b></td><td colspan='5'>"+esc(meta("dn","0110-111-001-XXX-XXXX"))+"</td></tr><tr><th>REV</th><th>DATE</th><th>SUBMISSION</th><th>PREPARED BY</th><th>CHECKED BY</th><th>APPROVED BY OSWAL</th></tr><tr><td>"+esc(meta("rv","0"))+"</td><td>"+esc(meta("dt",""))+"</td><td>"+esc(meta("sb",""))+"</td><td>"+esc(meta("pb",""))+"</td><td>"+esc(meta("ck",""))+"</td><td>"+esc(meta("ap",""))+"</td></tr></table>";
var n=0;t.sec.forEach(function(s){h+="<table><tr><th colspan='3'>"+s[0]+"</th></tr>";s[1].forEach(function(f){n++;h+="<tr><td style='width:40px'>"+n+"</td><td style='width:46%'>"+f[1]+"</td><td>"+esc(r.v[f[0]])+(f[2]?" "+f[2]:"")+"</td></tr>"});h+="</table>"});
h+="<table><tr><th colspan='3'>Calculated values</th></tr>";r.res.forEach(function(x){h+="<tr class='c'><td style='width:40px'>"+(++n)+"</td><td style='width:46%'>"+x[0]+"</td><td class='c'>"+x[1]+" "+x[2]+"</td></tr>"});h+="</table>";
h+="<table><tr><th>Design check</th><th style='width:90px'>Result</th><th>Remark</th></tr>";r.ck.forEach(function(x){h+="<tr><td>"+x[0]+"</td><td class='"+(x[1]?"ok":"no")+"'>"+(x[1]===null?"n/a":x[1]?"OK":"FAIL")+"</td><td>"+(x[1]===false?x[2]:"")+"</td></tr>"});h+="</table>";
h+="<p style='font-size:11px'>Calculated values are checks on the entered data using standard formulas. They do not replace the vendor design calculation or approval by a qualified engineer.</p>";
document.getElementById("doc").innerHTML=h;
var bad=r.ck.filter(function(x){return x[1]===false}).length;document.getElementById("st").textContent=bad?bad+" check(s) failing":"All checks OK"}
var tb=document.getElementById("tabs");
function tabsR(){tb.innerHTML="";var fs=[];TY.forEach(function(t){if(fs.indexOf(t.fam)<0)fs.push(t.fam)});
fs.forEach(function(f){var b=document.createElement("button");b.textContent=f;b.className=f==fam?"p":"";b.onclick=function(){fam=f;for(var i=0;i<TY.length;i++)if(TY[i].fam==f){cur=i;break}pick()};tb.appendChild(b)});
var s=document.createElement("span");s.textContent="|";s.className="m";tb.appendChild(s);
TY.forEach(function(t,i){if(t.fam!=fam)return;var b=document.createElement("button");b.textContent=t.n;b.setAttribute("role","tab");b.setAttribute("aria-selected",i==cur);b.onclick=function(){cur=i;cs=null;pick()};tb.appendChild(b)})}
function pick(){fam=TY[cur].fam;tabsR();form();doc()}

var KEY=localStorage.getItem("lum_key")||"";
function api(m,u,b){return fetch(u,{method:m,headers:{"content-type":"application/json","x-api-key":KEY},body:b?JSON.stringify(b):undefined}).then(function(r){if(r.status==401){KEY=prompt("API key")||"";localStorage.setItem("lum_key",KEY);return api(m,u,b)}return r.json()})}
function saveS(st){var t=TY[cur],r=run(),b={tid:t.id,status:st,meta:ST.meta||{},values:r.v};
if(st=="Approved"&&r.ck.some(function(c){return c[1]===false})&&!confirm("Some design checks are failing. Approve anyway?"))return;
(cs?api("PUT","/api/sheets/"+cs.id,b):api("POST","/api/sheets",b)).then(function(s){var e=document.getElementById("sm");if(s.error){e.textContent=s.error;return}cs=s;e.textContent=s.no+" Rev "+s.rev+" saved as "+s.status;listS()}).catch(function(){document.getElementById("sm").textContent="Server not reachable"})}
function listS(){api("GET","/api/sheets").then(function(a){var e=document.getElementById("sl");if(!e)return;if(!Array.isArray(a)||!a.length){e.textContent="No saved datasheets yet";return}
e.innerHTML=a.slice(0,15).map(function(s){return "<div><a href='#' data-o='"+s.id+"'>"+s.no+" Rev "+s.rev+"</a> "+esc(s.tid)+" "+esc(s.tag)+" – "+s.status+"</div>"}).join("");
e.querySelectorAll("[data-o]").forEach(function(l){l.onclick=function(ev){ev.preventDefault();api("GET","/api/sheets/"+l.dataset.o).then(function(s){for(var i=0;i<TY.length;i++)if(TY[i].id==s.tid)cur=i;ST[s.tid]=s.values;ST.meta=s.meta;cs=s;pick();document.getElementById("sm").textContent=s.no+" Rev "+s.rev+" "+s.status})}})}).catch(function(){})}
fetch("/api/templates").then(function(r){return r.json()}).then(function(a){a.forEach(function(t){TY.push(t)});cur=0;pick()}).catch(function(){document.getElementById("doc").textContent="Server not reachable. Start it with: node server.js"});
</script></body></html>
