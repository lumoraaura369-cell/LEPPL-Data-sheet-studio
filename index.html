h+="<table><tr><td><b>PROJECT:</b> "+esc(meta("pj",MF[3][2]))+"</td></tr></table><h2>"+esc(t.title)+"</h2><table><tr><td><b>DOCUMENT NUMBER</b></td><td colspan='5'>"+esc(meta("dn","0110-111-001-XXX-XXXX"))+"</td></tr><tr><th>REV</th><th>DATE</th><th>SUBMISSION</th><th>PREPARED BY</th><th>CHECKED BY</th><th>APPROVED BY OSWAL</th></tr><tr><td>"+esc(meta("rv","0"))+"</td><td>"+esc(meta("dt",""))+"</td><td>"+esc(meta("sb",""))+"</td><td>"+esc(meta("pb",""))+"</td><td>"+esc(meta("ck",""))+"</td><td>"+esc(meta("ap",""))+"</td></tr></table>";
var n=0;t.sec.forEach(function(s){h+="<table><tr><th colspan='3'>"+esc(s[0])+"</th></tr>";s[1].forEach(function(f){n++;h+="<tr><td style='width:40px'>"+n+"</td><td style='width:46%'>"+esc(f[1])+"</td><td>"+esc(r.v[f[0]])+(f[2]?" "+esc(f[2]):"")+"</td></tr>"});h+="</table>"});

(cs?api("PUT","/api/sheets/"+cs.id,b):api("POST","/api/sheets",b)).then(function(s){var e=document.getElementById("sm");if(s.error){e.textContent=s.error;return}cs=s;e.textContent=s.no+" Rev "+s.rev+" saved as "+s.status;listS()}).catch(function(){document.getElementById("sm").textContent="Server not reachable"})}

fetch("/api/templates").then(function(r){return r.json()}).then(function(a){a.forEach(function(t){TY.push(t)});cur=0;pick();go("dash")}).catch(function(){document.getElementById("doc").textContent="Server not reachable. Start it with: node server.js"});
